<!doctype html>
<!--
  The viewer half of tools/kn5_studio.py.

  A browser, because a browser is a glTF renderer that is already installed and
  already correct: PBR, sRGB, tone mapping, mipmaps and an orbit camera, none of
  which is worth writing again to look at a car. three.js is vendored beside this
  file (tools/viewer/three/) rather than pulled from a CDN, so the tool works on
  a machine with no network and does not change under you when a CDN moves.

  The controls sit in their own column, not over the picture. They were an
  overlay first and that was the wrong shape twice over: the panel covered the
  car you were turning, and an error printed into it appeared on top of a model
  that still looked fine, so a failure read as a rendering glitch.

  Everything here talks to the server and keeps no state worth reloading for:
  /api/cars lists the folder, /api/car picks one and returns its liveries,
  /api/skins is the same answer for a car already chosen, /api/select converts a
  livery, and /model/<car>/<name>.gltf is the result. The conversion lives in
  Python, where the rest of the pipeline already is.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>kn5 studio</title>
<style>
  :root {
    --bg: #16171b; --panel: #1b1d22; --line: #2f323a;
    --ink: #d7d9df; --dim: #8b8f99; --accent: #e0a63c; --bad: #e2705f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
               overflow: hidden; }

  #app { display: flex; height: 100%; }

  /* The controls. Their own column with its own scrollbar: a car with twenty
     liveries must not push the viewport around. */
  #side {
    width: 310px; flex: none; height: 100%; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  #view { flex: 1; min-width: 0; position: relative; }
  #view canvas { display: block; }

  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em;
       text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
  section { border-top: 1px solid var(--line); padding-top: 12px; }
  section:first-of-type { border-top: 0; padding-top: 0; }

  input, select, button { font: inherit; color: var(--ink); }
  #filter, #cars {
    width: 100%; background: #24262d; border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; font-size: 12px;
  }
  #filter { margin-bottom: 6px; }
  #pick[hidden] { display: none; }

  #car { font-size: 15px; font-weight: 600; word-break: break-all; }
  #stats, #paint, #foot { color: var(--dim); font-size: 12px; }
  #paint { margin-top: 4px; word-break: break-word; }

  #skins { display: flex; flex-direction: column; gap: 5px; }
  .skin {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: #24262d; border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 9px 6px 7px; cursor: pointer; font-size: 12px;
  }
  .skin:hover:not([disabled]) { border-color: #4a4e59; }
  .skin[aria-pressed="true"] { border-color: var(--accent); background: #2b2a26; }
  .skin[disabled] { opacity: .4; cursor: progress; }
  .chip {
    width: 16px; height: 16px; border-radius: 4px; flex: none;
    border: 1px solid rgba(0,0,0,.55);
  }
  .skin .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #note { font-size: 12px; color: var(--dim); }
  #note.err {
    color: var(--bad); background: #2a1e1c; border: 1px solid #4d2f2a;
    border-radius: 7px; padding: 8px 10px; white-space: pre-wrap;
  }
  #note.work { color: var(--accent); }

  #foot { margin-top: auto; font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <section id="pick">
      <h2>Car</h2>
      <input id="filter" type="search" placeholder="filter" autocomplete="off">
      <select id="cars"></select>
    </section>

    <section>
      <div id="car">-</div>
      <div id="stats">loading...</div>
      <div id="paint"></div>
    </section>

    <section>
      <h2>Paint</h2>
      <div id="skins"></div>
    </section>

    <section>
      <div id="note"></div>
    </section>

    <div id="foot">
      drag to turn &middot; wheel to zoom &middot; right-drag to pan<br>
      The first livery of a car takes a few seconds; the rest are quick, because
      only the textures that livery overrides are decoded again.
    </div>
  </aside>
  <div id="view"></div>
</div>

<script type="importmap">
{ "imports": { "three": "/viewer/three/build/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from '/viewer/three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from '/viewer/three/examples/jsm/controls/OrbitControls.js';

const el = (id) => document.getElementById(id);
const view = el('view');

// ---- scene ----------------------------------------------------------------
// Lights, not an environment map. An IBL would flatter the paint, and flattery
// is the opposite of what this is for: the question is whether the CONVERSION is
// right, so the shading stays plain enough that a wrong normal, a missing
// texture or a black material reads as itself.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16171b);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// Two clamps, and both are here because of what happened without them. Zooming
// past the bodywork puts the camera INSIDE the car, where the whole screen is
// the back face of one panel: a flat grey field with nothing to say it is still
// a car. Orbiting under the floor gives the same nothing from below. The
// model's own size sets both, in frame() - these are the values used until a
// model has been measured.
controls.minDistance = 0.5;
controls.maxDistance = 100;
controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2620, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(-5, 2, -4);
scene.add(fill);

// A metre grid: scale is one of the things an import gets wrong and it is
// invisible without a reference. A car should be a bit over four squares.
const grid = new THREE.GridHelper(20, 20, 0x4a4e59, 0x2b2d34);
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

// Sized from the VIEWPORT, not the window: the controls take a column, and a
// canvas sized to the window would be stretched by exactly that much.
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

(function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
})();

// ---- the model ------------------------------------------------------------
const loader = new GLTFLoader();
let current = null;

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return null;
  const size = box.getSize(new THREE.Vector3());
  const mid  = box.getCenter(new THREE.Vector3());
  // Sit the model ON the grid rather than through it - the grid is the floor,
  // and a car floating over it or sunk into it is worth seeing.
  obj.position.y -= box.min.y;
  mid.y -= box.min.y;
  const radius = 0.5 * size.length();
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) * 0.5) * 1.05;
  controls.target.copy(mid);
  camera.position.copy(mid).add(
    new THREE.Vector3(0.75, 0.42, 1).normalize().multiplyScalar(dist));
  camera.near = Math.max(dist / 500, 0.01);
  camera.far  = dist + radius * 8;
  camera.updateProjectionMatrix();
  // Close enough to read a badge, never close enough to be inside a door.
  controls.minDistance = radius * 0.55;
  controls.maxDistance = dist * 4;
  controls.update();
  return { size, radius };
}

function disposeTree(root) {
  // Meshes and their GPU buffers are not freed by dropping the reference:
  // switching livery a dozen times would otherwise leak a dozen cars.
  root.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (!o.material) return;
    for (const m of [].concat(o.material)) {
      for (const k of ['map', 'normalMap', 'metalnessMap', 'roughnessMap', 'emissiveMap'])
        if (m[k]) m[k].dispose();
      m.dispose();
    }
  });
}

function loadModel(url, keep) {
  return new Promise((resolve, reject) => {
    loader.load(url, (gltf) => {
      if (current) { scene.remove(current); disposeTree(current); }
      current = gltf.scene;
      scene.add(current);
      let tris = 0, meshes = 0;
      current.traverse((o) => {
        if (!o.isMesh) return;
        meshes++;
        const g = o.geometry;
        tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      });
      // Always measure - the clamps and the near/far come from it - but put the
      // camera back afterwards when this was only a colour change.
      const fit = frame(current);
      if (keep) {
        camera.position.copy(keep.pos);
        controls.target.copy(keep.target);
        controls.update();
      }
      resolve({ tris: Math.round(tris), meshes, size: fit && fit.size });
    }, undefined, reject);
  });
}

// ---- the liveries ---------------------------------------------------------
function note(msg, kind) {
  el('note').textContent = msg || '';
  el('note').className = msg ? (kind || '') : '';
}

let busy = false;

function setBusy(on) {
  busy = on;
  el('cars').disabled = on;
  for (const b of document.querySelectorAll('.skin')) b.disabled = on;
}

async function select(name) {
  if (busy) return;
  setBusy(true);
  note('converting ' + name + '...', 'work');
  // A colour change is not a request to be moved, so the camera goes back
  // exactly where it was - but only when there is already a car on screen.
  const keep = current
    ? { pos: camera.position.clone(), target: controls.target.clone() } : null;
  try {
    const r = await fetch('/api/select?skin=' + encodeURIComponent(name));
    const j = await r.json();
    if (j.error) { note(j.error, 'err'); return; }
    const info = await loadModel(j.url, keep);
    el('stats').textContent = info.meshes + ' meshes, ' +
      info.tris.toLocaleString() + ' triangles' +
      (info.size ? '  -  ' + info.size.toArray().map((v) => v.toFixed(2)).join(' x ') + ' m' : '');
    el('paint').textContent = j.paint || '';
    for (const b of document.querySelectorAll('.skin'))
      b.setAttribute('aria-pressed', String(b.dataset.name === name));
    note(j.warning || '', j.warning ? 'err' : '');
  } catch (e) {
    note('could not load the model: ' + (e && e.message || e), 'err');
  } finally {
    setBusy(false);
  }
}

function chipStyle(sk) {
  if (sk.hex) return 'background:#' + sk.hex;
  // A livery whose paint is a pattern rather than one colour gets no swatch,
  // and says so instead of inventing a colour for it.
  return 'background:repeating-linear-gradient(45deg,#3a3d45 0 3px,#555964 3px 6px)';
}

function renderSkins(j) {
  el('car').textContent = j.car;
  const box = el('skins');
  box.textContent = '';
  el('paint').textContent = '';
  if (j.error) { note(j.error, 'err'); el('stats').textContent = ''; return; }
  note('');
  for (const sk of j.skins) {
    const b = document.createElement('button');
    b.className = 'skin';
    b.dataset.name = sk.name;
    b.setAttribute('aria-pressed', 'false');
    b.title = sk.material
      ? sk.material + (sk.hex ? '  #' + sk.hex : '  (no flat colour)') + '  -  ' +
        (sk.source === 'skin' ? 'from this livery' : 'from the kn5, not the livery')
      : 'no painted material';
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.setAttribute('style', chipStyle(sk));
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = sk.name;
    b.append(chip, nm);
    b.onclick = () => select(sk.name);
    box.appendChild(b);
  }
  if (j.skins.length) select(j.current || j.skins[0].name);
  else el('stats').textContent = 'no liveries in this car';
}

// Choosing a car only READS it - materials, texture slots, triangle counts.
// The conversion waits for a livery, which renderSkins then picks, so one click
// still ends in a picture without ever converting a car nobody asked for.
async function pickCar(id) {
  if (busy || !id) return;
  setBusy(true);
  el('car').textContent = id;
  el('stats').textContent = 'reading...';
  el('skins').textContent = '';
  el('paint').textContent = '';
  note('');
  try {
    const j = await (await fetch('/api/car?id=' + encodeURIComponent(id))).json();
    setBusy(false);
    renderSkins(j);
  } catch (e) {
    note('could not read this car: ' + (e && e.message || e), 'err');
    setBusy(false);
  }
}

(async function boot() {
  const cars = await (await fetch('/api/cars')).json();
  const sel = el('cars'), all = cars.cars;

  // The filter rebuilds the list rather than hiding options: <select> has no
  // reliable way to hide one, and two hundred cars is a lot to scroll.
  function fill() {
    const q = el('filter').value.trim().toLowerCase();
    const keep = sel.value;
    sel.textContent = '';
    if (!cars.current) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = all.length + ' cars - pick one';
      sel.appendChild(o);
    }
    for (const c of all) {
      if (q && !c.toLowerCase().includes(q)) continue;
      const o = document.createElement('option');
      o.value = o.textContent = c;
      sel.appendChild(o);
    }
    if ([...sel.options].some((o) => o.value === keep)) sel.value = keep;
  }
  fill();
  el('filter').oninput = fill;
  sel.onchange = () => pickCar(sel.value);
  el('pick').hidden = all.length < 2;   // one car in means the choice is made

  if (cars.current) {
    sel.value = cars.current;
    renderSkins(await (await fetch('/api/skins')).json());
  } else {
    el('car').textContent = '-';
    el('stats').textContent = all.length + ' cars found';
    note('pick a car above');
  }
})();
</script>
</body>
</html>
