<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{head}
<link rel="icon" href="{assets}/favicon.svg" type="image/svg+xml">
<script>try{{var t=localStorage.getItem("acgltf-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}}catch(e){{}}</script>
<link rel="stylesheet" href="{assets}/style.css">
</head>
<body data-root="{root}">
<a class="skip" href="#content">Skip to content</a>

<header class="top">
  <a class="brand" href="{root}">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M3 8.5 12 3l9 5.5v7L12 21l-9-5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8.5 12 14l9-5.5M12 14v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span>{sitename}</span>
  </a>

  <form class="search" role="search" autocomplete="off" onsubmit="return false">
    <label class="sr-only" for="q">Search the documentation</label>
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Search docs" aria-label="Search the documentation"
           role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list"
           spellcheck="false">
    <kbd class="hint" aria-hidden="true">Ctrl K</kbd>
    <button type="button" class="search-close" aria-label="Close search">Cancel</button>
    <div id="results" class="results" role="listbox" aria-label="Search results" hidden></div>
  </form>

  <nav class="top-links" aria-label="Site">
    <a href="{root}docs/">Docs</a>
    <a href="{repo}" rel="noopener">GitHub</a>
    <button type="button" class="theme" aria-label="Switch colour theme" title="Switch colour theme">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/>
      </svg>
    </button>
    <button type="button" class="menu" aria-label="Open navigation" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Documentation">
    {nav}
  </nav>

  <main id="content">
    {body}
    {prevnext}
    <p class="edit search-skip"><a href="{edit}" rel="noopener">Edit this page on GitHub</a></p>
  </main>

  {toc}
</div>

<footer class="foot">
  <p>{sitename} {version} &middot; MIT licence &middot; <a href="{repo}" rel="noopener">source on GitHub</a></p>
  <p class="small">Not affiliated with Kunos Simulazioni. Assetto Corsa content belongs to its authors.</p>
</footer>

<script src="{assets}/site.js" defer></script>
<script src="{assets}/search.js" defer></script>
</body>
</html>
